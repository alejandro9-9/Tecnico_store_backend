services:
  - type: web
    name: evol-repair-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: STAFF_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATA_DIR
        value: /tmp/evol-data
